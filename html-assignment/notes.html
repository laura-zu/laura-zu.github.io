<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notes</title>
</head>
<body>

    <header>
        <h1>HTML Tags</h1>
    </header>

    <dl>

          <dt>h1 to h6</dt>
        <dd>defines headings and its importance</dd>
        <br>

        <dt>abbr</dt>
        <dd>defines an abbreviation</dd>
        <br>

        <dt>blockquote</dt>
        <dd>defines a section quoted from another source</dd>
        <br>

        <dt>strong</dt>
        <dd>defines important text making it bold</dd>
        <br>

        <dt>sup</dt>
        <dd>defines text as being superscript</dd>
        <br>

        <dt>section</dt>
        <dd>defines a section</dd>
        <br>

        <dt>ul</dt>
        <dd>defines an unordered list</dd>
        <br>

    </dl>
    
</body>
</html>
